<div class="garbage-management-record-event-garbage-full-manager">
  <div class="garbage-management-record-event-garbage-full-manager-head">
    <div class="button-group">
      <div
        class="button-bracket"
        [class.selected]="index == Index.list"
        (click)="on.index(Index.list)"
      >
        列表
      </div>
      <div
        class="button-bracket"
        [class.selected]="index == Index.station"
        (click)="on.index(Index.station)"
      >
        投放点
      </div>
      <!-- <div
        class="button-bracket"
        [class.selected]="index == Index.total"
        (click)="on.index(Index.total)"
      >
        总图表
      </div> -->
      <div
        class="button-bracket"
        [class.selected]="index == Index.details"
        (click)="on.index(Index.details)"
      >
        细分图表
      </div>
    </div>
  </div>
  <div class="garbage-management-record-event-garbage-full-manager-body">
    <howell-garbage-management-record-event-garbage-full-list-manager
      *ngIf="index == Index.list"
      [(args)]="args"
      (image)="on.image($event)"
      (video)="on.video.single($event)"
      (videoall)="on.video.all($event)"
      (complete)="on.complete($event)"
    ></howell-garbage-management-record-event-garbage-full-list-manager>
    <howell-garbage-management-record-event-garbage-full-station
      *ngIf="index == Index.station"
      [(args)]="args"
      (image)="on.station.image($event)"
      (video)="on.station.video($event)"
      (position)="on.station.position($event)"
    ></howell-garbage-management-record-event-garbage-full-station>

    <howell-garbage-management-record-event-garbage-full-statistic-details-manager
      *ngIf="index == Index.details"
      [(args)]="args"
    ></howell-garbage-management-record-event-garbage-full-statistic-details-manager>
  </div>
</div>
