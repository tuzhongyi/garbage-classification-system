<div class="garbage-management-record-event-garbage-full-station">
  <div class="garbage-management-record-event-garbage-full-station-head">
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">行政区:</div>
        <div class="form-item-value">
          <hw-select
            [(selected)]="table.args.divisionId"
            [nullable]="true"
            (click)="on.change.division()"
          >
            <howell-division-select
              [(selectedId)]="table.args.divisionId"
            ></howell-division-select>
          </hw-select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">社区:</div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="table.args.communityName" />
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">投放点:</div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="table.args.stationName" />
        </div>
      </div>
      <div class="form-item submit">
        <button class="button-border-blue" (click)="on.search()">查询</button>
      </div>
    </div>
  </div>
  <div class="garbage-management-record-event-garbage-full-station-body">
    <howell-garbage-management-station-list-table
      [args]="table.args"
      [load]="table.load"
      (image)="on.image($event)"
      (video)="on.video($event)"
      (position)="on.position($event)"
    ></howell-garbage-management-station-list-table>
  </div>
</div>
