<div class="garbage-management-record-event-ias-statistic-details-manager">
  <div
    class="garbage-management-record-event-ias-statistic-details-manager-head"
  >
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">选择时间</div>
        <div class="form-item-value date">
          <date-time-control
            [week]="date.week"
            [format]="date.format"
            [minView]="date.view.min"
            [startView]="date.view.min"
            [(date)]="chart.args.date"
          ></date-time-control>
        </div>
      </div>
      <!-- <div class="form-item">
        <div class="form-item-text">巡逻车辆</div>
        <div class="form-item-value stations">
          <hw-select [(selected)]="chart.args.deviceId" [nullable]="true">
            <select [(ngModel)]="chart.args.deviceId">
              <option [ngValue]="item.Id" *ngFor="let item of source.devices">
                {{ item.Name }}
              </option>
            </select>
          </hw-select>
        </div>
      </div> -->
      <div class="form-item submit">
        <button class="button-border-blue" (click)="on.search()">查询</button>
      </div>
    </div>
    <div class="forms">
      <div class="form-item">
        <select [(ngModel)]="chart.args.unit" (change)="on.unit()">
          <option [ngValue]="TimeUnit.Day">日报表</option>
          <option [ngValue]="TimeUnit.Week">周报表</option>
          <option [ngValue]="TimeUnit.Month">月报表</option>
        </select>
      </div>
    </div>
  </div>
  <div
    class="garbage-management-record-event-ias-statistic-details-manager-body"
  >
    <howell-garbage-management-record-event-ias-statistic-details-container
      [args]="chart.args"
      [load]="chart.load"
    ></howell-garbage-management-record-event-ias-statistic-details-container>
  </div>
</div>
