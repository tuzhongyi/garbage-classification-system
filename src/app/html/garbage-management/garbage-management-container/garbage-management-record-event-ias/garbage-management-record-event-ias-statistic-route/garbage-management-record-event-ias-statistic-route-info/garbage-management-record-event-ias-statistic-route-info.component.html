<div
  class="garbage-management-record-event-ias-statistic-route-info"
  *ngIf="data"
>
  <div
    class="garbage-management-record-event-ias-statistic-route-info-meter-total"
  >
    <div class="statistic-item">
      <div class="statistic-item-name">总里程</div>
      <div class="statistic-item-content">
        <div class="statistic-item-content-value">{{ data.TotalMeters }}</div>
        <div class="statistic-item-content-unit">公里</div>
      </div>
    </div>
  </div>
  <div
    class="garbage-management-record-event-ias-statistic-route-info-speed-avg"
  >
    <div class="statistic-item">
      <div class="statistic-item-name">平均时速</div>
      <div class="statistic-item-content">
        <div class="statistic-item-content-value">{{ data.AvgSpeed }}</div>
        <div class="statistic-item-content-unit">公里/小时</div>
      </div>
    </div>
  </div>
  <!-- <div
    class="garbage-management-record-event-ias-statistic-route-info-speed:fastest"
  >
    <div class="statistic-item">
      <div class="statistic-item-name">最高时速</div>
      <div class="statistic-item-content">
        <div class="statistic-item-content-value">
          {{ data.FastestSpeed }}
        </div>
        <div class="statistic-item-content-unit">公里/小时</div>
      </div>
    </div>
  </div> -->
  <div class="garbage-management-record-event-ias-statistic-route-info-moving">
    <div class="statistic-item">
      <div class="statistic-item-name">行驶时长</div>
      <div class="statistic-item-content">
        <div class="statistic-item-content-value">{{ data.MovingTime }}</div>
      </div>
    </div>
  </div>
  <div class="garbage-management-record-event-ias-statistic-route-info-stay">
    <div class="statistic-item">
      <div class="statistic-item-name">停留时长</div>
      <div class="statistic-item-content">
        <div class="statistic-item-content-value">
          {{ data.StayTime }}
        </div>
      </div>
    </div>
  </div>
</div>
