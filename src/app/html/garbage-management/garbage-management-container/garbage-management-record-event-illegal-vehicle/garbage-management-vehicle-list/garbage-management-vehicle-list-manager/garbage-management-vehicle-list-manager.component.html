<div class="garbage-management-record-event-illegal-vehicle-list-manager">
  <div
    class="garbage-management-record-event-illegal-vehicle-list-manager-head"
  >
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">行政区域:</div>
        <div class="form-item-value">
          <hw-select
            [(selected)]="table.args.divisionId"
            [nullable]="true"
            (selectedChange)="on.change.division()"
          >
            <howell-division-select
              [(selectedId)]="table.args.divisionId"
            ></howell-division-select>
          </hw-select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">车辆类型:</div>
        <div class="form-item-value">
          <select [(ngModel)]="table.args.type">
            <option [ngValue]="undefined">全部</option>
            <option [ngValue]="item.key" *ngFor="let item of source.types">
              {{ item.value }}
            </option>
          </select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">车牌颜色:</div>
        <div class="form-item-value">
          <select [(ngModel)]="table.args.color">
            <option [ngValue]="undefined">全部</option>
            <option [ngValue]="item.key" *ngFor="let item of source.colors">
              {{ item.value }}
            </option>
          </select>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">车牌号码:</div>
        <div class="form-item-value">
          <input type="text" [(ngModel)]="table.args.plate" />
        </div>
      </div>
      <div class="form-item submit">
        <button class="button-border-blue" (click)="on.search()">查询</button>
      </div>
    </div>
  </div>
  <div
    class="garbage-management-record-event-illegal-vehicle-list-manager-body"
  >
    <howell-garbage-management-vehicle-list-table
      [args]="table.args"
      [load]="table.load"
      (image)="on.image($event)"
      (edit)="on.details.open($event)"
      (delete)="on.delete.confirm($event)"
    ></howell-garbage-management-vehicle-list-table>

    <howell-window
      [model]="window.details"
      *ngIf="window.details.show"
      [style]="window.details.style"
      [title]="window.details.title"
    >
      <howell-garbage-management-vehicle-details
        [data]="window.details.data"
        (close)="window.details.close()"
        (save)="on.details.save($event)"
      ></howell-garbage-management-vehicle-details>
    </howell-window>
    <confirm-window
      *ngIf="window.confirm.show"
      [model]="window.confirm"
      [content]="window.confirm.content"
      (ok)="on.delete.do()"
      (cancel)="window.confirm.show = false"
    ></confirm-window>
  </div>
</div>
