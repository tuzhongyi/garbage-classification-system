<div class="garbage-management-street-device-route-manager">
  <div class="garbage-management-street-device-route-manager-head">
    <div class="forms">
      <div class="form-item">
        <div class="form-item-text">选择时间:</div>
        <div class="form-item-value">
          <date-time-control
            [week]="date.week"
            [format]="date.format"
            [minView]="date.view.min"
            [startView]="date.view.min"
            [(date)]="args.date"
          ></date-time-control>
        </div>
      </div>
      <div class="form-item">
        <div class="form-item-text">巡逻车辆:</div>
        <div class="form-item-value">
          <hw-select [(selected)]="args.deviceId" [nullable]="false">
            <select [(ngModel)]="args.deviceId">
              <option [ngValue]="item.Id" *ngFor="let item of source.devices">
                {{ item.Name }}
              </option>
            </select>
          </hw-select>
        </div>
      </div>
      <div class="form-item submit">
        <button class="button-border-blue" (click)="on.search()">查询</button>
      </div>
    </div>
    <div class="forms">
      <div class="form-item">
        <select [(ngModel)]="args.unit" (change)="on.unit()">
          <option [ngValue]="TimeUnit.Day">日报表</option>
          <option [ngValue]="TimeUnit.Week">周报表</option>
          <option [ngValue]="TimeUnit.Month">月报表</option>
        </select>
      </div>
    </div>
  </div>
  <div class="garbage-management-street-device-route-manager-body">
    <div class="garbage-management-street-device-route-manager-body-map">
      <howell-garbage-management-street-device-route-map
        [load]="load"
        [rectified]="rectified"
      ></howell-garbage-management-street-device-route-map>
      <div
        class="garbage-management-street-device-route-manager-body-map-settings"
      >
        <howell-garbage-management-street-device-route-map-settings
          [(rectified)]="rectified"
        >
        </howell-garbage-management-street-device-route-map-settings>
      </div>
    </div>
    <div class="garbage-management-street-device-route-manager-body-info">
      <howell-garbage-management-street-device-route-info
        [load]="load"
      ></howell-garbage-management-street-device-route-info>
    </div>
    <div class="garbage-management-street-device-route-manager-body-chart">
      <howell-garbage-management-street-device-route-chart-container
        [load]="load"
      ></howell-garbage-management-street-device-route-chart-container>
    </div>
  </div>
</div>
