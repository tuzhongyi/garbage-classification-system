<div class="video-multiple">
  <div
    *ngFor="let item of items; let index = index"
    class="video-multiple-item"
    [class]="'_' + items.length"
    [class.nodata]="!item"
    (click)="on.click(index, item)"
  >
    <howell-video-image
      *ngIf="item"
      [image]="item.image"
      [preview]="item.preview"
      [playback]="item.playback"
      [playable]="playable"
      (error)="on.error(index, $event)"
    ></howell-video-image>
  </div>
</div>
